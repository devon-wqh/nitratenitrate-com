name = "nitratenitrate-com"
main = "worker.js"
compatibility_date = "2026-06-24"

# Serve the static HTML/images, and run the Worker first so it can log views.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Permanent event log (views + clicks). database_id filled in after creating
# the D1 database in the Cloudflare dashboard.
[[d1_databases]]
binding = "DB"
database_name = "nitrate-stats"
database_id = "e8b2044b-10d1-4122-b0c5-6dafb706e9a1"

# Publishable key is safe in a public repo by design — it only identifies the
# account to Stripe.js and can't move money. Swap pk_test_ for pk_live_ when
# you're ready to take real payments.
[vars]
STRIPE_PUBLISHABLE_KEY = "pk_live_51TrKEqJvaj3PnfVHlXLxNS3krg1NfjtBnGojl2ff4WhexZhg7JTSLo1JZ2YvRb0BtmVcsYDDjOQqsaHu1Koo16bN00gEE2KYai"

# Ticket confirmation emails. The domain has to be onboarded once with
# `npx wrangler email sending enable nitratenitrate.com` before sends work.
[[send_email]]
name = "EMAIL"

# Structured logs for the checkout and webhook handlers.
[observability]
enabled = true
head_sampling_rate = 1

# Note: these are encrypted Worker secrets, set with `npx wrangler secret put
# <NAME>`, never committed here, because this repo is public.
#   STATS_KEY             the /stats password
#   RSVP_SHEET_URL        Apps Script endpoint for RSVP forwarding
#   STRIPE_SECRET_KEY     sk_test_... / sk_live_...
#   STRIPE_WEBHOOK_SECRET whsec_... from the webhook endpoint you register
